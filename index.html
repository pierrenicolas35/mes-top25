<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mes Cartes IGN</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; height: 100vh; width: 100vw; overflow: hidden; background: #0f172a; color: #f8fafc; }
    
    #sidebar {
      width: 340px;
      background: #1e293b;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #334155;
      z-index: 1000;
      transition: transform 0.3s ease;
    }

    .header { padding: 1rem; background: #0f172a; border-bottom: 1px solid #334155; }
    .header h1 { font-size: 1.15rem; font-weight: 700; color: #38bdf8; }
    .stats { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }

    .search-box { padding: 0.75rem; border-bottom: 1px solid #334155; }
    .search-box input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.9rem;
    }
    .search-box input:focus { outline: none; border-color: #38bdf8; }

    .list-container { flex: 1; overflow-y: auto; padding: 0.5rem; }
    .card-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.75rem;
      margin-bottom: 4px;
      background: #334155;
      border-radius: 6px;
      cursor: pointer;
    }
    .card-item:hover { background: #475569; }
    .card-item.owned { border-left: 4px solid #22c55e; }
    .card-info { flex: 1; margin-right: 8px; }
    .card-ref { font-weight: bold; font-size: 0.9rem; color: #f1f5f9; }
    .card-name { font-size: 0.75rem; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }

    #map { flex: 1; height: 100%; width: 100%; }

    .custom-badge { padding: 2px 6px; font-size: 0.7rem; border-radius: 4px; background: #64748b; }
    .custom-badge.owned { background: #16a34a; }

    .mobile-btn {
      display: none;
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 2000;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      #sidebar { position: absolute; height: 100%; transform: translateX(-100%); }
      #sidebar.open { transform: translateX(0); }
      .mobile-btn { display: block; }
    }
  </style>
</head>
<body>

  <button class="mobile-btn" onclick="toggleSidebar()">☰ Liste</button>

  <div id="sidebar">
    <div class="header">
      <h1>Mes Cartes IGN TOP 25</h1>
      <div class="stats" id="stats">Chargement...</div>
    </div>
    <div class="search-box">
      <input type="text" id="search" placeholder="Rechercher par réf. ou nom..." oninput="renderList()">
    </div>
    <div class="list-container" id="list"></div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    let IGN_DATA = [];
    let owned = JSON.parse(localStorage.getItem('ign_owned_cards') || '[]');
    let geoLayers = {};

    const map = L.map('map').setView([46.6, 2.5], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    function getStyle(isOwned) {
      return {
        color: isOwned ? '#16a34a' : '#94a3b8',
        weight: isOwned ? 2 : 0.8,
        fillColor: isOwned ? '#22c55e' : '#cbd5e1',
        fillOpacity: isOwned ? 0.5 : 0.05
      };
    }

    fetch('./top25.json')
      .then(res => res.json())
      .then(data => {
        IGN_DATA = data;
        IGN_DATA.forEach(card => {
          const bounds = [
            [card.bbox[0], card.bbox[1]],
            [card.bbox[2], card.bbox[3]]
          ];
          const isOwned = owned.includes(card.ref);
          const rect = L.rectangle(bounds, getStyle(isOwned)).addTo(map);

          rect.bindTooltip(`<b>${card.ref}</b><br>${card.name}`, { sticky: true });
          rect.on('click', () => toggleCard(card.ref));
          geoLayers[card.ref] = rect;
        });
        updateUI();
      })
      .catch(err => {
        console.error("Erreur de chargement de top25.json:", err);
        document.getElementById('stats').innerText = "Erreur de chargement du catalogue.";
      });

    function toggleCard(ref) {
      if (owned.includes(ref)) {
        owned = owned.filter(id => id !== ref);
      } else {
        owned.push(ref);
      }
      localStorage.setItem('ign_owned_cards', JSON.stringify(owned));
      updateUI();
    }

    function updateUI() {
      IGN_DATA.forEach(card => {
        const isOwned = owned.includes(card.ref);
        if (geoLayers[card.ref]) {
          geoLayers[card.ref].setStyle(getStyle(isOwned));
        }
      });
      document.getElementById('stats').innerText = `${owned.length} / ${IGN_DATA.length} carte(s) possédée(s)`;
      renderList();
    }

    function renderList() {
      const query = document.getElementById('search').value.toLowerCase();
      const listEl = document.getElementById('list');
      listEl.innerHTML = '';

      IGN_DATA
        .filter(c => c.ref.toLowerCase().includes(query) || c.name.toLowerCase().includes(query))
        .sort((a, b) => (owned.includes(b.ref) - owned.includes(a.ref)))
        .forEach(card => {
          const isOwned = owned.includes(card.ref);
          const div = document.createElement('div');
          div.className = `card-item ${isOwned ? 'owned' : ''}`;
          div.innerHTML = `
            <div class="card-info">
              <div class="card-ref">${card.ref}</div>
              <div class="card-name">${card.name}</div>
            </div>
            <span class="custom-badge ${isOwned ? 'owned' : ''}">${isOwned ? 'Possédée' : 'Ajouter'}</span>
          `;
          div.onclick = () => {
            toggleCard(card.ref);
            const b = geoLayers[card.ref].getBounds();
            map.fitBounds(b, { maxZoom: 11 });
          };
          listEl.appendChild(div);
        });
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }
  </script>
</body>
</html>
