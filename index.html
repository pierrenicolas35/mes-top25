<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mes Cartes IGN Partagées</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; height: 100vh; width: 100vw; overflow: hidden; background: #0f172a; color: #f8fafc; }
    
    #sidebar {
      width: 360px;
      background: #1e293b;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #334155;
      z-index: 1000;
      transition: transform 0.3s ease;
    }

    .header { padding: 1rem; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.1rem; font-weight: 700; color: #38bdf8; }

    .section { padding: 0.75rem 1rem; border-bottom: 1px solid #334155; }
    .section-title { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; font-weight: 700; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; }

    .row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
    select, input[type="text"] {
      flex: 1;
      padding: 0.45rem 0.6rem;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.85rem;
    }
    input[type="color"] {
      width: 38px;
      height: 32px;
      border: 1px solid #475569;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
      padding: 0;
    }

    .btn {
      padding: 0.45rem 0.65rem;
      border-radius: 6px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-outline { background: transparent; border: 1px solid #475569; color: #94a3b8; }
    .btn-outline:hover { background: #334155; color: #fff; }

    /* Filtres et profils */
    .user-list { display: flex; flex-direction: column; gap: 5px; max-height: 140px; overflow-y: auto; }
    .user-item { display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; background: #334155; padding: 4px 8px; border-radius: 6px; }
    .user-item-active { border: 1px solid #38bdf8; }
    .user-info-label { display: flex; align-items: center; gap: 6px; cursor: pointer; flex: 1; }
    .color-dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

    .search-box { padding: 0.75rem; border-bottom: 1px solid #334155; }
    .list-container { flex: 1; overflow-y: auto; padding: 0.5rem; }
    .card-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.75rem;
      margin-bottom: 4px;
      background: #334155;
      border-radius: 6px;
      cursor: pointer;
    }
    .card-item:hover { background: #475569; }
    .card-item.owned { border-left: 4px solid #22c55e; }
    .card-info { flex: 1; margin-right: 8px; }
    .card-ref { font-weight: bold; font-size: 0.85rem; color: #f1f5f9; }
    .card-name { font-size: 0.75rem; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }

    .owners-badges { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 3px; }
    .owner-pill { font-size: 0.65rem; padding: 1px 5px; border-radius: 3px; color: #fff; font-weight: bold; }

    #map { flex: 1; height: 100%; width: 100%; }

    .mobile-btn {
      display: none;
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 2000;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Modal / Formulaire d'édition */
    #editPanel { display: none; background: #0f172a; padding: 8px; border-radius: 6px; margin-top: 6px; border: 1px solid #475569; }

    @media (max-width: 768px) {
      #sidebar { position: absolute; height: 100%; transform: translateX(-100%); }
      #sidebar.open { transform: translateX(0); }
      .mobile-btn { display: block; }
    }
  </style>
</head>
<body>

  <button class="mobile-btn" onclick="toggleSidebar()">☰ Menu</button>

  <div id="sidebar">
    <div class="header">
      <h1>Mes Cartes IGN</h1>
      <button class="btn btn-outline" style="font-size:0.75rem;" onclick="loadUsersFromSheets(true)">↻ Sync</button>
    </div>

    <!-- Gestion des profils & Filtres -->
    <div class="section">
      <div class="section-title">
        <span>Profils & Visibilité</span>
        <button class="btn btn-outline" style="padding:2px 6px; font-size:0.7rem;" onclick="toggleAddUserForm()">+ Profil</button>
      </div>

      <!-- Formulaire d'ajout -->
      <div id="addUserForm" style="display:none; margin-bottom:8px;">
        <div class="row">
          <input type="text" id="newUserName" placeholder="Nom du profil...">
          <input type="color" id="newUserColor" value="#3b82f6" title="Couleur">
          <button class="btn" onclick="createUser()">Créer</button>
        </div>
      </div>

      <!-- Formulaire d'édition de profil -->
      <div id="editPanel">
        <div style="font-size:0.75rem; color:#94a3b8; margin-bottom:4px;">Modifier le profil :</div>
        <div class="row">
          <input type="text" id="editUserName">
          <input type="color" id="editUserColor">
        </div>
        <div class="row" style="justify-content: flex-end;">
          <button class="btn btn-danger" style="font-size:0.75rem;" onclick="deleteUser()">Supprimer</button>
          <button class="btn" style="font-size:0.75rem;" onclick="saveUserEdit()">Enregistrer</button>
          <button class="btn btn-outline" style="font-size:0.75rem;" onclick="closeEditPanel()">Annuler</button>
        </div>
      </div>

      <div class="user-list" id="userList"></div>
    </div>

    <!-- Recherche -->
    <div class="search-box">
      <input type="text" id="search" placeholder="Rechercher réf. ou nom..." oninput="renderList()">
    </div>
    
    <div class="list-container" id="list"></div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzq_nTRyluvvIz23JXm-cUS9NxmIwrPqueXIpYVyRfjGD_6iAXvL35CKEzMo4iH2l5I/exec";

    let IGN_DATA = [];
    let users = [];
    let currentUserId = null;
    let visibleUserIds = new Set();
    let geoLayers = {};
    let userBeingEdited = null;

  // 1. Initialisation de la carte
    const map = L.map('map', {
      center: [45.2, 5.9],
      zoom: 9
    });

    // --- FONDS DE CARTE IGN (Géoplateforme officielle) ---
    const scan25Layer = L.tileLayer('https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=GEOGRAPHICALGRIDSYSTEMS.SCAN25TOUR&STYLE=normal&FORMAT=image/jpeg&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}', {
      maxZoom: 18,
      minZoom: 6,
      attribution: '© IGN - Cartes TOP 25'
    });

    const planIgnLayer = L.tileLayer('https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&FORMAT=image/png&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}', {
      maxZoom: 19,
      attribution: '© IGN - Plan IGN'
    });

    const satIgnLayer = L.tileLayer('https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&FORMAT=image/jpeg&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}', {
      maxZoom: 19,
      attribution: '© IGN - Orthophoto'
    });

    // --- FONDS DE CARTE GOOGLE ---
    const googleRoads = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '© Google Maps'
    });

    const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '© Google Satellite'
    });

    // --- OPENSTREETMAP ---
    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    });

    // Fond affiché par défaut (Plan IGN ou TOP 25)
    planIgnLayer.addTo(map);

    // Sélecteur de couches en haut à droite
    const baseMaps = {
      "🗺️ Plan IGN": planIgnLayer,
      "🌲 Carte TOP 25 (IGN)": scan25Layer,
      "🛰️ Satellite IGN": satIgnLayer,
      "📍 Google Maps": googleRoads,
      "🌍 Google Satellite": googleHybrid,
      "🌐 OpenStreetMap": osmLayer
    };

    L.control.layers(baseMaps, null, { position: 'topright', collapsed: true }).addTo(map);

    // 2. Chargement initial
    Promise.all([
      fetch('./top25.json').then(res => res.json()),
      loadUsersFromSheets()
    ]).then(([geoData]) => {
      IGN_DATA = geoData;

      IGN_DATA.forEach(card => {
        const bounds = [
          [card.bbox[0], card.bbox[1]],
          [card.bbox[2], card.bbox[3]]
        ];
        const rect = L.rectangle(bounds, { color: '#94a3b8', weight: 0.8, fillOpacity: 0.05 }).addTo(map);
        rect.bindTooltip(`<b>${card.ref}</b><br>${card.name}`, { sticky: true });
        rect.on('click', () => toggleCard(card.ref));
        geoLayers[card.ref] = rect;
      });

      updateMapAndUI();
    }).catch(err => console.error("Erreur d'initialisation :", err));

    // 3. Google Sheets Backend
    async function loadUsersFromSheets(forceUpdate = false) {
      try {
        const res = await fetch(GOOGLE_SCRIPT_URL);
        users = await res.json();
        if (users.length > 0) {
          if (!currentUserId || !users.some(u => u.id === currentUserId)) {
            currentUserId = users[0].id;
          }
          if (visibleUserIds.size === 0 || forceUpdate) {
            users.forEach(u => visibleUserIds.add(u.id));
          }
        }
        refreshUserControls();
        if (forceUpdate) updateMapAndUI();
      } catch (err) {
        console.error("Erreur de synchronisation Google Sheets :", err);
      }
    }

    function toggleAddUserForm() {
      const f = document.getElementById('addUserForm');
      f.style.display = f.style.display === 'none' ? 'block' : 'none';
    }

    async function createUser() {
      const name = document.getElementById('newUserName').value.trim();
      const color = document.getElementById('newUserColor').value;
      if (!name) return;

      const newUser = { id: Date.now(), user_name: name, color: color, owned_cards: [] };
      users.push(newUser);
      currentUserId = newUser.id;
      visibleUserIds.add(newUser.id);
      document.getElementById('newUserName').value = '';
      toggleAddUserForm();
      
      refreshUserControls();
      updateMapAndUI();

      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'create_user', user_name: name, color: color })
      });
    }

    function openEditPanel(user, e) {
      e.stopPropagation();
      userBeingEdited = user;
      document.getElementById('editUserName').value = user.user_name;
      document.getElementById('editUserColor').value = user.color;
      document.getElementById('editPanel').style.display = 'block';
    }

    function closeEditPanel() {
      userBeingEdited = null;
      document.getElementById('editPanel').style.display = 'none';
    }

    async function saveUserEdit() {
      if (!userBeingEdited) return;
      const oldName = userBeingEdited.user_name;
      const newName = document.getElementById('editUserName').value.trim();
      const newColor = document.getElementById('editUserColor').value;
      if (!newName) return;

      userBeingEdited.user_name = newName;
      userBeingEdited.color = newColor;

      closeEditPanel();
      refreshUserControls();
      updateMapAndUI();

      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'update_user', old_name: oldName, new_name: newName, color: newColor })
      });
    }

    async function deleteUser() {
      if (!userBeingEdited || !confirm(`Supprimer définitivement le profil de ${userBeingEdited.user_name} ?`)) return;
      const nameToDelete = userBeingEdited.user_name;
      users = users.filter(u => u.id !== userBeingEdited.id);
      visibleUserIds.delete(userBeingEdited.id);
      if (currentUserId === userBeingEdited.id) {
        currentUserId = users.length > 0 ? users[0].id : null;
      }
      closeEditPanel();
      refreshUserControls();
      updateMapAndUI();

      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'delete_user', user_name: nameToDelete })
      });
    }

    async function toggleCard(ref) {
      if (!currentUserId) {
        alert("Choisis d'abord un profil actif en cliquant sur son nom.");
        return;
      }

      const user = users.find(u => u.id === currentUserId);
      if (!user) return;

      let owned = user.owned_cards || [];
      if (owned.includes(ref)) {
        owned = owned.filter(r => r !== ref);
      } else {
        owned.push(ref);
      }
      user.owned_cards = owned;
      updateMapAndUI();

      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'save_cards', user_name: user.user_name, owned_cards: owned })
      });
    }

    function selectActiveUser(id) {
      currentUserId = id;
      refreshUserControls();
      renderList();
    }

    function toggleFilterUser(id, isChecked, e) {
      e.stopPropagation();
      if (isChecked) visibleUserIds.add(id);
      else visibleUserIds.delete(id);
      updateMapAndUI();
    }

    // 4. Rendu Visuel
    function refreshUserControls() {
      const userListEl = document.getElementById('userList');
      userListEl.innerHTML = '';

      users.forEach(u => {
        const isCurrent = u.id === currentUserId;
        const item = document.createElement('div');
        item.className = `user-item ${isCurrent ? 'user-item-active' : ''}`;
        
        item.innerHTML = `
          <div class="user-info-label" onclick="selectActiveUser(${u.id})">
            <input type="checkbox" ${visibleUserIds.has(u.id) ? 'checked' : ''} onclick="toggleFilterUser(${u.id}, this.checked, event)">
            <span class="color-dot" style="background:${u.color}"></span>
            <span style="font-weight:${isCurrent ? 'bold' : 'normal'}; color:${isCurrent ? '#38bdf8' : '#fff'}">${u.user_name}</span>
            <span style="font-size:0.7rem;color:#94a3b8;">(${(u.owned_cards || []).length})</span>
          </div>
          <button class="btn btn-outline" style="padding:2px 6px; font-size:0.7rem;" onclick="openEditPanel(users.find(x => x.id === ${u.id}), event)">⚙</button>
        `;
        userListEl.appendChild(item);
      });
    }

    function updateMapAndUI() {
      const visibleUsers = users.filter(u => visibleUserIds.has(u.id));

      IGN_DATA.forEach(card => {
        const owners = visibleUsers.filter(u => (u.owned_cards || []).includes(card.ref));
        const layer = geoLayers[card.ref];
        if (!layer) return;

        if (owners.length === 0) {
          layer.setStyle({ color: '#94a3b8', weight: 0.8, fillColor: '#cbd5e1', fillOpacity: 0.05 });
        } else if (owners.length === 1) {
          layer.setStyle({ color: owners[0].color, weight: 2, fillColor: owners[0].color, fillOpacity: 0.5 });
        } else {
          layer.setStyle({ color: '#f59e0b', weight: 2.5, fillColor: '#d97706', fillOpacity: 0.6 });
        }
      });

      refreshUserControls();
      renderList();
    }

    function renderList() {
      const query = document.getElementById('search').value.toLowerCase().replace(/\s+/g, '');
      const listEl = document.getElementById('list');
      listEl.innerHTML = '';

      const activeUser = users.find(u => u.id === currentUserId);
      const activeOwned = activeUser ? (activeUser.owned_cards || []) : [];

      IGN_DATA
        .filter(c => {
          const refNorm = c.ref.toLowerCase().replace(/\s+/g, '');
          const nameNorm = c.name.toLowerCase().replace(/\s+/g, '');
          return refNorm.includes(query) || nameNorm.includes(query);
        })
        .sort((a, b) => (activeOwned.includes(b.ref) - activeOwned.includes(a.ref)))
        .forEach(card => {
          const isOwnedByMe = activeOwned.includes(card.ref);
          const cardOwners = users.filter(u => (u.owned_cards || []).includes(card.ref));

          const div = document.createElement('div');
          div.className = `card-item ${isOwnedByMe ? 'owned' : ''}`;
          
          let badgesHtml = cardOwners.map(o => 
            `<span class="owner-pill" style="background:${o.color}">${o.user_name}</span>`
          ).join('');

          div.innerHTML = `
            <div class="card-info">
              <div class="card-ref">${card.ref}</div>
              <div class="card-name">${card.name}</div>
              <div class="owners-badges">${badgesHtml}</div>
            </div>
            <button class="btn" style="padding:4px 8px; font-size:0.75rem; background:${isOwnedByMe ? '#16a34a' : '#475569'}">
              ${isOwnedByMe ? 'Possédée' : 'Ajouter'}
            </button>
          `;

          div.onclick = () => {
            toggleCard(card.ref);
            const b = geoLayers[card.ref].getBounds();
            map.fitBounds(b, { maxZoom: 11 });
          };
          listEl.appendChild(div);
        });
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }
  </script>
</body>
</html>
